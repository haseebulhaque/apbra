[project]
name = "apbra-api"
version = "0.1.0"
description = "APBRA invite-only private case foundation"
requires-python = ">=3.13"
dependencies = [
  "alembic==1.20.0",
  "authlib==1.8.0",
  "cryptography==46.0.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.9",
  "pydantic-settings==2.11.0",
  "sqlalchemy==2.0.54",
  "uvicorn[standard]==0.36.0",
]

[dependency-groups]
dev = [
  "mypy==1.18.2",
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apbra_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
files = ["src/apbra_api"]

[[tool.mypy.overrides]]
module = "authlib.*"
ignore_missing_imports = true
