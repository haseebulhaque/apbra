name: apbra-mvp1

services:
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: apbra
      POSTGRES_USER: apbra
      POSTGRES_PASSWORD: ${APBRA_POSTGRES_PASSWORD:?Set APBRA_POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apbra -d apbra"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:54321:5432"
    volumes:
      - apbra_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APBRA_PROFILE: ${APBRA_PROFILE:?Set APBRA_PROFILE}
      APBRA_DATABASE_URL: ${APBRA_DATABASE_URL:?Set APBRA_DATABASE_URL}
      APBRA_PUBLIC_ORIGIN: ${APBRA_PUBLIC_ORIGIN:?Set APBRA_PUBLIC_ORIGIN}
      APBRA_API_ORIGIN: ${APBRA_API_ORIGIN:?Set APBRA_API_ORIGIN}
      APBRA_SESSION_SECRET: ${APBRA_SESSION_SECRET:?Set APBRA_SESSION_SECRET}
      APBRA_BOOTSTRAP_ENABLED: ${APBRA_BOOTSTRAP_ENABLED:?Set APBRA_BOOTSTRAP_ENABLED}
      APBRA_INVITATION_TTL_DAYS: ${APBRA_INVITATION_TTL_DAYS:?Set APBRA_INVITATION_TTL_DAYS}
      APBRA_EVIDENCE_ROOT: ${APBRA_EVIDENCE_ROOT:?Set APBRA_EVIDENCE_ROOT}
      APBRA_REFERENCE_ROOT: ${APBRA_REFERENCE_ROOT:?Set APBRA_REFERENCE_ROOT}
      APBRA_ARTIFACT_ROOT: ${APBRA_ARTIFACT_ROOT:?Set APBRA_ARTIFACT_ROOT}
      APBRA_SEMANTIC_BRIDGE_PATH: ${APBRA_SEMANTIC_BRIDGE_PATH:?Set APBRA_SEMANTIC_BRIDGE_PATH}
      APBRA_GENERATION_BRIDGE_PATH: ${APBRA_GENERATION_BRIDGE_PATH:?Set APBRA_GENERATION_BRIDGE_PATH}
      APBRA_SEMANTIC_NODE_PATH: ${APBRA_SEMANTIC_NODE_PATH:?Set APBRA_SEMANTIC_NODE_PATH}
      APBRA_SEMANTIC_TIMEOUT_SECONDS: ${APBRA_SEMANTIC_TIMEOUT_SECONDS:?Set APBRA_SEMANTIC_TIMEOUT_SECONDS}
      APBRA_GENERATION_TIMEOUT_SECONDS: ${APBRA_GENERATION_TIMEOUT_SECONDS:?Set APBRA_GENERATION_TIMEOUT_SECONDS}
      APBRA_UPLOAD_POLICY_JSON: ${APBRA_UPLOAD_POLICY_JSON:?Set APBRA_UPLOAD_POLICY_JSON}
      APBRA_CLARIFICATION_POLICY_JSON: ${APBRA_CLARIFICATION_POLICY_JSON:?Set APBRA_CLARIFICATION_POLICY_JSON}
      APBRA_GENERATION_POLICY_JSON: ${APBRA_GENERATION_POLICY_JSON:?Set APBRA_GENERATION_POLICY_JSON}
      APBRA_AUTOMATIC_GENERATION_ENABLED: ${APBRA_AUTOMATIC_GENERATION_ENABLED:?Set APBRA_AUTOMATIC_GENERATION_ENABLED}
      APBRA_MODEL_PROVIDER_PROFILE_JSON: ${APBRA_MODEL_PROVIDER_PROFILE_JSON:?Set APBRA_MODEL_PROVIDER_PROFILE_JSON}
      APBRA_MODEL_PROVIDER_API_KEY: ${APBRA_MODEL_PROVIDER_API_KEY:?Set APBRA_MODEL_PROVIDER_API_KEY}
      APBRA_OIDC_RESPONSE_ISSUER_POLICY: ${APBRA_OIDC_RESPONSE_ISSUER_POLICY:?Set APBRA_OIDC_RESPONSE_ISSUER_POLICY}
      APBRA_OIDC_AUTHORIZATION_RESPONSE_ISS_PARAMETER_SUPPORTED: ${APBRA_OIDC_AUTHORIZATION_RESPONSE_ISS_PARAMETER_SUPPORTED:?Set APBRA_OIDC_AUTHORIZATION_RESPONSE_ISS_PARAMETER_SUPPORTED}
    command:
      - /bin/sh
      - -ec
      - alembic upgrade head && python -m apbra_api.bootstrap && exec uvicorn apbra_api.main:app --host 0.0.0.0 --port 8000 --no-access-log
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"
      interval: 3s
      timeout: 3s
      retries: 30
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - apbra_evidence_data:/var/lib/apbra/evidence
      - apbra_reference_data:/var/lib/apbra/references
      - apbra_artifact_data:/var/lib/apbra/artifacts

volumes:
  apbra_postgres_data:
  apbra_evidence_data:
  apbra_reference_data:
  apbra_artifact_data:
